name: Proves i publicació

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  proves:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run pdf
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publica:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: proves
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.desplegament.outputs.page_url }}
    steps:
      - id: desplegament
        uses: actions/deploy-pages@v4
